<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11130f">
  <title>Historical Run App</title>
  <style>
    :root{--bg:#10130f;--panel:#1b2119;--panel2:#242b21;--text:#f3f3ee;--muted:#b8c0b2;--accent:#d9b36c;--line:#3a4236}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:900px;margin:auto;padding:24px 16px 60px}h1{margin:0 0 8px;font-size:clamp(28px,6vw,46px)}
    .lead{color:var(--muted);line-height:1.6;margin:0 0 24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
    .card h2{margin:0 0 8px;font-size:22px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;cursor:pointer}
    .btn.primary{border-color:var(--accent);font-weight:700}.status{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--panel2);color:var(--muted);display:none}
    code{direction:ltr;unicode-bidi:embed}.small{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <h1>Historical Run App</h1>
  <p class="lead">אפליקציות שטח היסטוריות עצמאיות להורדה ושימוש גם ללא חיבור לאינטרנט.</p>
  <div id="catalog"></div>
  <div id="status" class="status"></div>
  <p class="small">קישור ישיר להורדה: <code>https://historicalrunning.github.io/HistoricalRunApp/?run=1</code>. אם הדפדפן חוסם הורדה אוטומטית, יוצג כפתור הורדה ידני.</p>
</main>
<script>
const runs = {
  "1": {
    title: "שער הגיא – פארק קנדה – נחל יתלה",
    description: "מדריך שטח היסטורי עם תמונות, נקודות GPS וגלריות. מותאם Portrait ו-Landscape ועובד Offline לאחר ההורדה.",
    file: "apps/ShaarHagay-CanadaPark-Yitla.html",
    downloadName: "ShaarHagay-CanadaPark-Yitla.html"
  }
};
const catalog=document.getElementById("catalog"),statusBox=document.getElementById("status");
function createDownloadLink(run,primary=false){const a=document.createElement("a");a.href=run.file;a.download=run.downloadName;a.className="btn"+(primary?" primary":"");a.textContent=primary?"הורד לשימוש Offline":"הורד";return a;}
function renderCatalog(){Object.entries(runs).forEach(([id,run])=>{const card=document.createElement("section");card.className="card";const h=document.createElement("h2");h.textContent=run.title;const p=document.createElement("p");p.className="meta";p.textContent=run.description;const actions=document.createElement("div");actions.className="actions";const download=createDownloadLink(run,true);const open=document.createElement("a");open.href=run.file;open.className="btn";open.textContent="פתח בדפדפן";const direct=document.createElement("a");direct.href="?run="+encodeURIComponent(id);direct.className="btn";direct.textContent="קישור הורדה ישיר";actions.append(download,open,direct);card.append(h,p,actions);catalog.appendChild(card);});}
function tryAutoDownload(){const id=new URLSearchParams(location.search).get("run");if(!id)return;const run=runs[id];statusBox.style.display="block";if(!run){statusBox.textContent="לא נמצאה אפליקציה עבור run="+id;return;}statusBox.textContent="מתחיל הורדה של: "+run.title+"…";const a=createDownloadLink(run,false);a.style.display="none";document.body.appendChild(a);setTimeout(()=>{a.click();setTimeout(()=>{statusBox.innerHTML="";statusBox.append("אם ההורדה לא התחילה אוטומטית: ");const fallback=createDownloadLink(run,true);fallback.textContent="לחץ כאן להורדה";statusBox.appendChild(fallback);},1200);},250);}
renderCatalog();tryAutoDownload();
</script>
</body></html>
